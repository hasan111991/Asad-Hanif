<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PP-203 Smart Constituency Management &amp; Development Portal</title>
    <script>
      (function() {
        var l = window.location;
        var pathname = l.pathname;
        var parts = pathname.split('/').filter(Boolean);
        // If repo path e.g. /repo-name/some-page on GitHub Pages
        if (l.hostname.endsWith('github.io') && parts.length > 0) {
          var repo = parts[0];
          var subRoute = parts.slice(1).join('/');
          if (subRoute && subRoute !== 'index.html' && subRoute !== '404.html') {
            window.location.replace(l.origin + '/' + repo + '/#' + subRoute + l.search);
            return;
          }
          window.location.replace(l.origin + '/' + repo + '/' + l.search + l.hash);
          return;
        }
        // Custom domain or root
        var last = parts[parts.length - 1];
        if (last && last !== 'index.html' && last !== '404.html') {
          window.location.replace('/#' + last + l.search);
        } else {
          window.location.replace('/' + l.search + l.hash);
        }
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 50px 20px; background-color: #F7F9F7; color: #064D2B;">
    <h2>Redirecting to PP-203 Portal...</h2>
    <p>Please wait while we redirect you to the application.</p>
  </body>
</html>
