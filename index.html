    <!-- Single Page App Query-String Decoder for GitHub Pages (preserves ./ asset resolution) -->
    <script>
      (function (l) {
        if (l.search && l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          var cleanPath = l.pathname.replace(/\/index\.html$/i, '');
          var rootPath = cleanPath.endsWith('/') ? cleanPath : cleanPath + '/';
          var hashTarget = decoded.startsWith('/') ? '#' + decoded : '#/' + decoded;
          window.history.replaceState(null, '', rootPath + hashTarget);
        }
      })(window.location);
    </script>
