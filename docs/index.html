    <script>
      // Automatic GitHub Pages handler:
      // If deployed on GitHub Pages from repository root (where /src/main.tsx is uncompiled),
      // seamlessly forward to /docs/ where the pre-compiled production build is hosted.
      (function() {
        var l = window.location;
        if (l.hostname.endsWith('github.io')) {
          var p = l.pathname;
          if (!p.includes('/docs')) {
            var clean = p.replace(/\/+$/, '');
            var parts = clean.split('/').filter(Boolean);
            var repo = parts.length > 0 ? '/' + parts[0] : '';
            window.location.replace(l.origin + repo + '/docs/' + l.search + l.hash);
          }
        }
      })();
    </script>
