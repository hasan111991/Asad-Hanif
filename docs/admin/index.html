<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PP-203 Smart Secretariat &amp; Admin Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Noto+Nastaliq+Urdu:wght@400..700&display=swap">
    <script>
      (function() {
        var l = window.location;
        var p = l.pathname;
        var base = p.replace(/\/admin(\/.*)?$/, '/');
        window.location.replace(l.origin + base + '#admin');
      })();
    </script>
  </head>
  <body style="font-family: 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-color: #064D2B; color: white;">
    <div style="text-align: center; padding: 2rem; max-width: 480px;">
      <div style="width: 44px; height: 44px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.2); border-top-color: #FBBF24; animation: spin 0.8s linear infinite; margin: 0 auto 1.5rem auto;"></div>
      <h2 style="font-size: 1.5rem; margin: 0 0 0.5rem 0; font-weight: bold;">PP-203 Secretariat Portal</h2>
      <p style="opacity: 0.85; margin: 0 0 1.5rem 0; font-size: 0.95rem;">Opening Authorized Personnel Access...</p>
      <a href="../#admin" style="display: inline-block; padding: 0.6rem 1.2rem; background: #087A43; color: white; text-decoration: none; border-radius: 0.5rem; font-weight: bold; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.2);">
        Click here if not redirected automatically
      </a>
    </div>
    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </body>
</html>
