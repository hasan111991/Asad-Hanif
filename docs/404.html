<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chaudhry Asad Hanif Jutt – Official Website</title>
    <script>
      // Single Page App redirect for GitHub Pages & static hosts supporting pathSegmentsToKeep
      (function () {
        var l = window.location;
        var pathSegmentsToKeep = 0;
        if (l.hostname.endsWith('github.io')) {
          pathSegmentsToKeep = l.pathname.indexOf('/docs/') !== -1 || /\/docs$/.test(l.pathname) ? 2 : 1;
        }
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 48px 20px; background: #F7F9F7; color: #123B28;">
    <p>Redirecting to portal...</p>
  </body>
</html>
